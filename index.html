  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: 'Cormorant Garamond', Georgia, serif; }

    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.1rem 2.4rem; z-index: 10;
    }
    .nav-logo-landing { display: flex; align-items: center; text-decoration: none; opacity: .8; transition: opacity .2s; }
    .nav-logo-landing:hover { opacity: 1; }
    .n-links { display: flex; gap: 2rem; list-style: none; }
    .n-links a { font-size: .82rem; letter-spacing: .11em; text-transform: uppercase; color: #555; font-weight: 300; text-decoration: none; transition: color .25s; }
    .n-links a:hover { color: #111; }

    .name-label {
      position: fixed; left: 2.4rem; top: 22%;
      z-index: 5;
    }
    .name-row {
      display: flex; align-items: flex-end; gap: 2rem;
      opacity: 0; transform: translateY(14px);
      animation: up 1.2s ease .4s forwards;
      text-decoration: none;
    }
    .name-row h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: 300;
      letter-spacing: .05em; color: #1a1a1a; line-height: 1.15;
      transition: color .3s;
    }
    .name-row:hover h1 { color: #555; }
    .name-label p.role {
      font-size: clamp(.78rem, 1.05vw, .92rem); letter-spacing: .11em;
      color: #444; font-style: normal; font-weight: 300;
      margin-top: .7rem;
      opacity: 0; transform: translateY(10px);
      animation: up 1s ease .85s forwards;
    }
    .name-label p.tagline {
      font-size: clamp(.72rem, .95vw, .84rem); letter-spacing: .10em;
      color: #666; font-style: italic; font-weight: 300;
      margin-top: .3rem;
      opacity: 0; transform: translateY(10px);
      animation: up 1s ease .95s forwards;
    }
    .enter-link {
      font-size: clamp(.9rem, 1.4vw, 1.1rem); letter-spacing: .14em; text-transform: uppercase;
      color: #555; font-weight: 300;
      border-bottom: none; padding-bottom: 0;
      transition: color .25s, border-color .25s;
      white-space: nowrap; margin-bottom: .38rem;
      text-decoration: none;
    }
    .enter-link:hover { color: #111; border-color: #222; }

    .quote {
      position: fixed; bottom: 1.8rem; left: 0; right: 0;
      text-align: center; z-index: 10; pointer-events: none;
      opacity: 0; animation: up 1.2s ease 1.4s forwards;
    }
    .quote p {
      font-size: clamp(.58rem, .85vw, .72rem);
      font-style: italic; font-weight: 300;
      letter-spacing: .06em; line-height: 1.8;
      color: rgba(255, 255, 255, 0.58);
    }

    @keyframes up { to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 580px) {
      .n-links { gap: 1.2rem; }
      .n-links a { font-size: .62rem; }
      .name-label { top: 16%; }
    }
  </style>
</head>
<body>

  <canvas id="wc"></canvas>

  <nav>
    <a href="index.html" class="nav-logo-landing" aria-label="Maryam Mokhberi">
      <svg width="110" height="36" viewBox="0 0 110 36" xmlns="http://www.w3.org/2000/svg">

        <text x="46" y="15" font-family="'Cormorant Garamond',Georgia,serif" font-size="7.5" font-weight="400" letter-spacing="2.6" fill="#666" dominant-baseline="middle">MARYAM</text>
        <text x="46" y="26" font-family="'Cormorant Garamond',Georgia,serif" font-size="7.5" font-weight="400" letter-spacing="2.6" fill="#666" dominant-baseline="middle">MOKHBERI</text>

    <ul class="n-links">

  <div class="name-label">
    <a href="home.html" class="name-row">
      <h1>Maryam<br>Mokhberi</h1>
      <span class="enter-link" aria-label="Enter site">
        <svg width="80" height="16" viewBox="0 0 80 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="8" x2="68" y2="8" stroke="currentColor" stroke-width="1.3"/>
          <polyline points="60,2 72,8 60,14" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

    <p class="role">UX Researcher &amp; Service Consultant</p>
    <p class="tagline">AI &amp; Society &nbsp;·&nbsp; Care &nbsp;·&nbsp; Community</p>
  </div>

  <div class="quote">
    <p>be like agua — flexible, delicate, and powerful —<br>
    and always carry the memory of the ocean, even when you are just a single drop.</p>
  </div>

  <script>
  (() => {
    const cv = document.getElementById('wc');
    const cx = cv.getContext('2d');
    let W, H;

    function resize() {
      W = cv.width  = window.innerWidth;
      H = cv.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const STARS = Array.from({ length: 180 }, () => ({
      nx:     Math.random(),
      ny:     Math.random(),
      r:      Math.random() * 1.8 + 0.5,
      tw:     Math.random() * Math.PI * 2,
      ts:     Math.random() * 0.004 + 0.001,  // slow twinkle
      bright: Math.random() * 0.35 + 0.65,
    }));

    const wLayers = [
      { speed: .55,  freq: 1.4, phase: 0.0 },
      { speed: .80,  freq: 1.9, phase: 1.2 },
      { speed: 1.10, freq: 2.5, phase: 2.3 },
      { speed: 1.40, freq: 3.0, phase: 0.7 },
    ];

    function waveOffset(nx, t, l) {
      return Math.sin(nx * Math.PI * 2 * l.freq + t * l.speed + l.phase) * 0.42
           + Math.sin(nx * Math.PI * 2 * l.freq * .53 + t * l.speed * .72 + l.phase + 1.1) * 0.28
           + Math.sin(nx * Math.PI * 2 * l.freq * 1.75 + t * l.speed * 1.35 + l.phase + 2.4) * 0.18;
    }

    function buildPts(t, l, amp, midY) {
      const pts = [];
      for (let x = 0; x <= W; x += 3)
        pts.push([x, midY + waveOffset(x / W, t, l) * amp]);
      return pts;
    }

    function tracePath(pts) {
      cx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        cx.quadraticCurveTo(
          pts[i][0], pts[i][1],
          (pts[i][0] + pts[i+1][0]) / 2,
          (pts[i][1] + pts[i+1][1]) / 2
        );
      }
      cx.lineTo(W, pts[pts.length - 1][1]);
    }

    function frame(ts) {
      const t = ts * .0008;
      cx.clearRect(0, 0, W, H);
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, W, H);

      const midY    = H * .54;
      const amp     = H * .13;
      const bandTop = midY - amp * 1.6;

      const deepPts = buildPts(t, wLayers[0], amp, midY);

      // clip to wave shape, fill with night gradient
      cx.save();
      cx.beginPath();
      tracePath(deepPts);
      cx.lineTo(W, H); cx.lineTo(0, H); cx.closePath();
      cx.clip();

      const ng = cx.createLinearGradient(0, bandTop, 0, H);
      ng.addColorStop(0,   '#08121f');
      ng.addColorStop(.3,  '#0b1a30');
      ng.addColorStop(.65, '#0e2040');
      ng.addColorStop(1,   '#0c1c38');
      cx.fillStyle = ng;
      cx.fillRect(0, bandTop, W, H - bandTop);

      // stars
      for (const s of STARS) {
        const sy  = bandTop + s.ny * (H - bandTop);
        const sx  = s.nx * W;
        const xi  = Math.min(Math.floor(s.nx * (deepPts.length - 1)), deepPts.length - 1);
        if (sy < deepPts[xi][1]) continue;
        const twinkle = s.bright * (0.70 + 0.30 * Math.sin(ts * s.ts + s.tw));
        cx.beginPath(); cx.arc(sx, sy, s.r, 0, Math.PI * 2);
        cx.fillStyle = `rgba(220,235,255,${twinkle})`; cx.fill();
        if (s.r > 1.1 && twinkle > 0.70) {
          cx.strokeStyle = `rgba(210,230,255,${twinkle * .32})`;
          cx.lineWidth = .5;
          const sp = s.r * 2.8;
          cx.beginPath(); cx.moveTo(sx - sp, sy); cx.lineTo(sx + sp, sy); cx.stroke();
          cx.beginPath(); cx.moveTo(sx, sy - sp); cx.lineTo(sx, sy + sp); cx.stroke();
        }
      }
      cx.restore();

      // mid layers
      for (let i = 1; i <= 2; i++) {
        const pts = buildPts(t, wLayers[i], amp * (.86 - i * .07), midY + i * amp * .07);
        cx.beginPath(); tracePath(pts);
        cx.lineTo(W, H); cx.lineTo(0, H); cx.closePath();
        cx.fillStyle = `rgba(12,35,100,${.17 - i * .04})`; cx.fill();
      }

      // crest line
      const crestPts = buildPts(t, wLayers[3], amp * .82, midY - amp * .04);
      cx.beginPath(); tracePath(crestPts);
      cx.strokeStyle = 'rgba(130,175,255,0.38)';
      cx.lineWidth = 1.5; cx.stroke();

      // foam
      for (let i = 0; i < crestPts.length; i += 7) {
        const [fx, fy] = crestPts[i];
        const a = 0.09 + 0.08 * Math.sin(ts * .003 + i * .4);
        cx.beginPath(); cx.arc(fx, fy, 1.1, 0, Math.PI * 2);
        cx.fillStyle = `rgba(200,220,255,${a})`; cx.fill();
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
